<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebApiShop — כניסה והרשמה</title>
    <link rel="stylesheet" href="style.css" />
    <script defer src="home.js"></script>
</head>
<body>

    <!-- ── Navbar ── -->
    <header class="navbar">
        <a class="brand" href="home.html">🛒 WebApi<span>Shop</span></a>
        <nav>
            <a href="home.html">דף הבית</a>
        </nav>
    </header>

    <!-- ── Hero ── -->
    <section class="page-hero">
        <h1>ברוכים הבאים לחנות</h1>
        <p>התחבר לחשבונך או צור חשבון חדש תוך שניות</p>
    </section>

    <!-- ── Cards ── -->
    <main class="cards-wrapper">

        <!-- Login card -->
        <div class="card">
            <h2>🔑 משתמש רשום</h2>

            <div class="field">
                <label for="userName1">אימייל</label>
                <input type="email" id="userName1" name="userName1" placeholder="your@email.com" required />
            </div>

            <div class="field">
                <label for="pass1">סיסמא</label>
                <input type="password" id="pass1" name="pass1" placeholder="••••••••" required />
            </div>

            <button class="btn btn-primary w-full" onclick="login()">כניסה לחשבון</button>

            <div class="divider"></div>
            <p class="text-muted text-center">עדיין אין לך חשבון? הירשם מימין 👈</p>
        </div>

        <!-- Register card -->
        <div class="card">
            <h2>✨ משתמש חדש</h2>

            <div class="field">
                <label for="userName">אימייל</label>
                <input type="email" id="userName" name="userName" placeholder="your@email.com" required />
            </div>

            <div class="field strength-wrap">
                <label for="pass">סיסמא</label>
                <input type="password" id="pass" name="pass" placeholder="••••••••" required />
                <button class="btn btn-outline" type="button" onclick="CheckPasswordStrength()">🔍 בדוק חוזק סיסמא</button>
                <progress class="strength-bar progressBar" max="100" value="0"></progress>
            </div>

            <div class="field">
                <label for="firstName">שם פרטי</label>
                <input type="text" id="firstName" name="firstName" placeholder="ישראל" required />
            </div>

            <div class="field">
                <label for="lastName">שם משפחה</label>
                <input type="text" id="lastName" name="lastName" placeholder="ישראלי" required />
            </div>

            <button class="btn btn-accent w-full" onclick="GetIn()">📝 הירשם עכשיו</button>
        </div>

    </main>

    <footer>
        &copy; 2026 WebApiShop — כל הזכויות שמורות
    </footer>

</body>
</html>
